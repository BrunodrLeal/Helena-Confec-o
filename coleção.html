<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helena Confecção / Coleção</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/logo-hc-novo.png" type="image/x-icon">
    
    <!-- SwiperJS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">

</head>
<body>

    <header class="menu">
        <div class="logo">
            <img src="imagens/logo-hc-novo.png" alt="Helena Confecção">
            <span>Helena Confecção / Coleção</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="coleção.html">Coleção</a></li>
                <li><a href="#">Roupas</a></li>
                <li><a href="#">Buscar</a></li>
                <li><a href="#">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="colecoes">
            <h2>Conheça Nossas Coleções</h2>
        
            <!-- Categoria Infantil -->
            <div class="categoria">
                <div class="swiper swiper-infantil">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="imagens/infantil f.png" alt="Infantil 1"></div>
                        <div class="swiper-slide"><img src="imagens/infantil m.png" alt="Infantil 2"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
                <h3>Infantil</h3>
                <a href="#">Ver coleção</a>
            </div>
        
            <!-- Categoria Adulto -->
            <div class="categoria">
                <div class="swiper swiper-adulto">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="imagens/adulto1.png" alt="Adulto 1"></div>
                        <div class="swiper-slide"><img src="imagens/adulto2.png" alt="Adulto 2"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
                <h3>Adulto</h3>
                <a href="#">Ver coleção</a>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
