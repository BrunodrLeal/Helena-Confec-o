<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helena Confecção</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/logo-hc-novo.png" type="image/x-icon">
</head>
<body>
    <header class="menu">
        <div class="logo">
            <img src="imagens/logo-hc-novo.png" alt="Helena Confecção">
            <span>Helena Confecção</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Coleção</a></li>

                <li><a href="#">Buscar</a></li>
                <li><a href="#">Entrar</a></li>

        </nav>
    </header>

    <main>
        <div class="parallax">
            <div class="parallax-background"></div>
        </div>
        
        <section class="pedidos">
            <h2>Faça seu Pedido</h2>
            <p>Escolha seu modelo e forma de pagamento.</p>
            <div class="formas-pagamento">
                <img src="imagens/cartao-de-credito.avif" alt="Cartão de Crédito">
                <img src="imagens/pix.png" alt="Pix">
                <img src="imagens/fatura.png" alt="Boleto">
